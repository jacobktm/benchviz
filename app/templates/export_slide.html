{% extends "base.html" %}
{% block title %}Exported Comparison{% endblock %}

{% block content %}
<div class="page-section" style="max-width:1200px;margin:0 auto;">
    <h2 style="margin-bottom:1rem;color:var(--text-primary);">Exported comparison slide</h2>
    <div style="margin-bottom:1rem;display:flex;gap:0.5rem;align-items:center;">
        <a href="{{ url_for('compare') }}" class="btn btn-secondary">← Back to compare</a>
        <a href="{{ download_url }}" class="btn btn-primary">Download PNG</a>
    </div>
    <div style="background:#0d1117;border-radius:12px;padding:1rem;box-shadow:0 10px 30px rgba(0,0,0,0.4);">
        <div style="overflow:auto;">
            <img src="{{ image_url }}" alt="Benchviz exported comparison" style="max-width:100%;height:auto;display:block;margin:0 auto;">
        </div>
    </div>
    <form action="{{ url_for('delete_export_slide', export_id=export_id) }}" method="post" style="margin-top:1rem;">
        <button type="submit" class="btn btn-danger">Delete this export</button>
    </form>
</div>
{% endblock %}
