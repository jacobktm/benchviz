<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BenchViz</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body>
    <nav class="navbar glass">
        <div class="nav-content">
            <a href="/" class="brand">BenchViz</a>
            <div class="nav-links">
                <a href="/">Dashboard</a>
                <a href="/upload">Upload Benchmarks</a>
                <a href="/insights">Performance Insights</a>
                <a href="/compare" class="btn-primary-sm">Compare Systems</a>
                <a href="/compare/saved">Saved Comparisons</a>
                <a href="/export/slides">Exported Slides</a>
            </div>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
